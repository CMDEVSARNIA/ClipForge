name: Android APK and Windows app

# Builds the debug APK and the Windows installer, runs the unit tests on every push, then publishes both:
#  - pushes to a branch → the rolling "latest-debug" pre-release (stable download link)
#  - tags like v1.0.0  → a release named after the tag
on:
  push:
    branches: [main, "ccr-*"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages (platform 37, NDK, CMake)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.31.6" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="ClipForge-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-debug-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Move the latest-debug tag to this commit
        if: github.ref_type == 'branch'
        run: |
          git tag -f latest-debug
          git push -f origin latest-debug

      - name: Remove older APKs from the latest-debug release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-debug >/dev/null 2>&1; then
            gh release view latest-debug --json assets -q '.assets[].name' | { grep -E '\.apk$' || true; } | while read -r name; do
              [ -n "$name" ] && gh release delete-asset latest-debug "$name" -y
            done
          fi
          # A fixed file name gives one download link that always serves the newest build.
          cp "${{ steps.apk.outputs.name }}" ClipForge-latest.apk

      - name: Publish latest debug build
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: ClipForge (latest debug build)
          prerelease: true
          make_latest: false
          body: |
            Built from `${{ github.sha }}` on `${{ github.ref_name }}` (version ${{ steps.apk.outputs.version }}).

            **Android:** download the .apk on your phone and open it to install (allow "Install unknown apps" for your browser).
            Signed with the repo's debug key, so it updates earlier ClipForge debug installs in place.
            Always-current link: https://github.com/${{ github.repository }}/releases/download/latest-debug/ClipForge-latest.apk

            **Windows (preview):** the .msi installer appears here a few minutes after the APK.
            It isn't code-signed yet, so Windows shows "Windows protected your PC": choose More info, then Run anyway.
            Always-current link: https://github.com/${{ github.repository }}/releases/download/latest-debug/ClipForge-Desktop-latest.msi
          files: |
            ${{ steps.apk.outputs.name }}
            ClipForge-latest.apk

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true

  desktop-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # LGPL build (no GPL encoders), bundled into the installer and used by the tests.
      - name: Download FFmpeg for Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET=$(gh release view latest --repo BtbN/FFmpeg-Builds --json assets -q '.assets[].name' \
            | grep -E '^ffmpeg-n[0-9.]+-latest-win64-lgpl-[0-9.]+\.zip$' | sort -V | tail -1)
          echo "Using $ASSET"
          gh release download latest --repo BtbN/FFmpeg-Builds --pattern "$ASSET" --dir ffdl
          unzip -q "ffdl/$ASSET" -d ffdl
          DIR=desktop/appResources/windows-x64/ffmpeg
          mkdir -p "$DIR"
          cp ffdl/*/bin/ffmpeg.exe ffdl/*/bin/ffprobe.exe "$DIR"/
          cp ffdl/*/LICENSE.txt "$DIR"/FFMPEG-LICENSE.txt
          echo "$ASSET" > "$DIR"/FFMPEG-BUILD.txt
          cygpath -w "$PWD/$DIR" >> "$GITHUB_PATH"
          "$DIR/ffmpeg.exe" -hide_banner -version | head -1

      - name: Desktop tests (Windows)
        run: ./gradlew --no-daemon -Pclipforge.desktopOnly=true :core:test :desktop:test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-report
          path: desktop/build/reports/tests

      - name: Build the installer
        run: ./gradlew --no-daemon -Pclipforge.desktopOnly=true :desktop:packageMsi

      - name: Name the installer
        id: msi
        run: |
          VERSION=$(sed -n 's/.*packageVersion = "\([^"]*\)".*/\1/p' desktop/build.gradle.kts)
          NAME="ClipForge-Desktop-${VERSION}.msi"
          cp desktop/build/compose/binaries/main/msi/*.msi "$NAME"
          cp "$NAME" ClipForge-Desktop-latest.msi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la *.msi

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Desktop-msi
          path: ${{ steps.msi.outputs.name }}

      - name: Remove older installers from the latest-debug release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-debug --json assets -q '.assets[].name' | { grep -E '\.msi$' || true; } | while read -r name; do
            [ -n "$name" ] && gh release delete-asset latest-debug "$name" -y
          done

      - name: Add the installer to the latest debug build
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest-debug "${{ steps.msi.outputs.name }}" ClipForge-Desktop-latest.msi --clobber

      - name: Add the installer to the tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.msi.outputs.name }}" --clobber
