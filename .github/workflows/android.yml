name: Android APK

# Builds the debug APK and runs the unit tests on every push, then publishes the APK:
#  - pushes to a branch → the rolling "latest-debug" pre-release (stable download link)
#  - tags like v1.0.0  → a release named after the tag
on:
  push:
    branches: [main, "ccr-*"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages (platform 37, NDK, CMake)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.31.6" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="ClipForge-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-debug-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Move the latest-debug tag to this commit
        if: github.ref_type == 'branch'
        run: |
          git tag -f latest-debug
          git push -f origin latest-debug

      - name: Remove older APKs from the latest-debug release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-debug >/dev/null 2>&1; then
            gh release view latest-debug --json assets -q '.assets[].name' | while read -r name; do
              [ -n "$name" ] && gh release delete-asset latest-debug "$name" -y
            done
          fi
          # A fixed file name gives one download link that always serves the newest build.
          cp "${{ steps.apk.outputs.name }}" ClipForge-latest.apk

      - name: Publish latest debug build
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: ClipForge (latest debug build)
          prerelease: true
          make_latest: false
          body: |
            Debug APK built from `${{ github.sha }}` on `${{ github.ref_name }}` (version ${{ steps.apk.outputs.version }}).
            Download the .apk on your phone and open it to install (allow "Install unknown apps" for your browser).
            Signed with the repo's debug key, so it updates earlier ClipForge debug installs in place.
            Always-current link: https://github.com/${{ github.repository }}/releases/download/latest-debug/ClipForge-latest.apk
          files: |
            ${{ steps.apk.outputs.name }}
            ClipForge-latest.apk

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
